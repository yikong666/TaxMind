[project]
name = "taxmind"
version = "0.1.0"
description = "TaxMind 税智通——企业级智能财税知识问答系统"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "beautifulsoup4>=4.13,<5",
    "datasets>=4,<5",
    "fastapi>=0.116,<1",
    "flagembedding>=1.3,<2",
    "httpx>=0.28,<1",
    "minio>=7.2,<8",
    "milvus-model>=0.2,<1",
    "openai>=1.100,<3",
    "pillow>=11.3,<13",
    "pymupdf>=1.26,<2",
    "pydantic-settings>=2.10,<3",
    "pymysql>=1.1,<2",
    "pymilvus>=2.5,<3",
    "python-jose[cryptography]>=3.5,<4",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "rapidocr-onnxruntime>=1.4,<2",
    "redis>=6.4,<7",
    "sqlalchemy>=2.0,<3",
    "torch>=2.7,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
